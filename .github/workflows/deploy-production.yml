name: Deploy Production to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual trigger via GitHub Actions'

# Enforce least-privilege permissions
permissions:
  contents: read
  id-token: write

# Prevent concurrent production deployments from racing
concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build, Verify & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies reproducibly
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --prefer-offline --no-audit
          fi

      - name: Run TypeScript type checks
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build production assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: Verify build output directory
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::Build verification failed: dist/index.html does not exist."
            exit 1
          fi
          echo "Build artifact verified: dist/ directory contains $(ls -1 dist | wc -l) entries."

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCPULSE_FF978 }}
          channelId: live
          projectId: docpulse-ff978
